name: Ellis External Phase C Dust and Two Null Beams v7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  einstein-toolkit-phase-c:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: einsteintoolkit/carpetx:cpu-real64
    env:
      SPACETIMEX_SHA: e89fe1d3ee47adaf881f051c502fac61e4a4c0f9
      ACCELERATOR: cpu
      REAL_PRECISION: real64
      MODE: optimize
      OMP_NUM_THREADS: 2
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize and static-check Ellis harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p EllisDustX
          echo 'UkVRVUlSRVMgQ2FycGV0WCBMb29wCg==' | base64 -d > EllisDustX/configuration.ccl
          mkdir -p EllisDustX
          echo '' | base64 -d > EllisDustX/interface.ccl
          mkdir -p EllisDustX
          echo '' | base64 -d > EllisDustX/param.ccl
          mkdir -p EllisDustX
          echo '' | base64 -d > EllisDustX/schedule.ccl
          mkdir -p EllisDustX/src
          echo '' | base64 -d > EllisDustX/src/ellis_dustx.cxx
          mkdir -p EllisDustX/src
          echo 'U1JDUyA9IGVsbGlzX2R1c3R4LmN4eAo=' | base64 -d > EllisDustX/src/make.code.defn
          mkdir -p par
          echo '' | base64 -d > par/ellis_dust_z4c.template.par
          mkdir -p scripts
          echo '' | base64 -d > scripts/patch_thornlist.py
          mkdir -p scripts
          echo '' | base64 -d > scripts/make_parfiles.py
          mkdir -p scripts
          echo '' | base64 -d > scripts/collect_norms.py
          mkdir -p scripts
          echo '' | base64 -d > scripts/phaseA_release_gate.py
          python3 -m py_compile scripts/*.py
          grep -q '^REQUIRES CarpetX Loop$' EllisDustX/configuration.ccl
          ! grep -Eq 'READS:[[:space:]]+Z4c::(K_hat|Theta|alphaG)' EllisDustX/schedule.ccl
          grep -q 'ADMBaseX::metric' EllisDustX/schedule.ccl
          grep -q 'ADMBaseX::curv' EllisDustX/schedule.ccl
          grep -q 'ADMBaseX::lapse' EllisDustX/schedule.ccl

      - name: Record external runner identity
        shell: bash
        run: |
          set -euxo pipefail
          uname -a | tee runner_identity.txt
          g++ --version | head -n 1 | tee -a runner_identity.txt
          python3 --version | tee -a runner_identity.txt
          echo "container=einsteintoolkit/carpetx:cpu-real64" | tee -a runner_identity.txt
          echo "spacetimex_sha=${SPACETIMEX_SHA}" | tee -a runner_identity.txt

      - name: Check out pinned SpacetimeX
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/EinsteinToolkit/SpacetimeX.git SpacetimeX
          git -C SpacetimeX checkout "${SPACETIMEX_SHA}"
          test "$(git -C SpacetimeX rev-parse HEAD)" = "${SPACETIMEX_SHA}"

      - name: Phase-C source preflight and conservation adversarial tests
        shell: bash
        run: |
          set -euxo pipefail
          test -f EllisBeamX/src/ellis_beamx.cxx
          grep -q 'tr+kxxMixed' EllisBeamX/src/ellis_beamx.cxx
          python3 -m py_compile scripts/phaseC_audit.py
          python3 scripts/phaseC_audit.py --selftest

      - name: Install EllisBeamX and reduce to minimal SpacetimeX build set
        shell: bash
        run: |
          set -euxo pipefail
          cp -a EllisBeamX SpacetimeX/EllisBeamX
          sed -i 's/EllisDustX/EllisBeamX/g' scripts/patch_thornlist.py
          python3 scripts/patch_thornlist.py SpacetimeX/scripts/spacetimex.th
          grep '^SpacetimeX/' SpacetimeX/scripts/spacetimex.th
          test "$(grep -c '^SpacetimeX/' SpacetimeX/scripts/spacetimex.th)" -eq 3
          ! grep -q '^SpacetimeX/AHFinderX$' SpacetimeX/scripts/spacetimex.th

      - name: Download Cactus and Einstein Toolkit dependencies
        working-directory: SpacetimeX
        shell: bash
        run: /bin/bash scripts/download.sh

      - name: Align MPI ABI and dependency libraries with container
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("SpacetimeX/scripts/actions-cpu-real64.cfg")
          s=p.read_text()
          replacements={
            "ADIOS2_LIBS = adios2_cxx11_mpi adios2_cxx11":
              "ADIOS2_LIBS = adios2_cxx_mpi adios2_cxx mgard protobuf",
            "HDF5_LIBS = hdf5_hl_cpp hdf5_cpp hdf5hl_fortran hdf5_fortran hdf5_hl hdf5":
              "HDF5_LIBS = hdf5_hl_cpp hdf5_cpp hdf5_hl_fortran hdf5_fortran hdf5_hl_f90cstub hdf5_f90cstub hdf5_hl hdf5",
          }
          for before,after in replacements.items():
              if s.count(before)!=1:
                  raise SystemExit(f"Expected exactly one legacy library setting: {before}")
              s=s.replace(before,after)
          if s.count("BOOST_DIR = /usr") != 1:
              raise SystemExit("Unexpected BOOST_DIR setting")
          if any(line.strip().startswith("BOOST_LIBS =") for line in s.splitlines()):
              raise SystemExit("Unexpected existing BOOST_LIBS setting")
          s=s.replace("BOOST_DIR = /usr","BOOST_DIR = /usr\nBOOST_LIBS = boost_filesystem")
          # The current runner uses the /usr/local MPI ABI bridge.
          # Mixing /usr's native MPI with /usr/local AMReX/ADIOS2/openPMD
          # yields unresolved ompi_communicator_t* symbols at final link.
          if s.count("MPI_DIR = /usr") != 1:
              raise SystemExit("Unexpected MPI_DIR in pinned SpacetimeX config")
          if any(line.strip().startswith("MPI_LIBS =") for line in s.splitlines()):
              raise SystemExit("Unexpected existing MPI_LIBS setting")
          s=s.replace("MPI_DIR = /usr", "MPI_DIR = /usr/local\nMPI_LIBS = mpif mpi_abi")
          p.write_text(s)
          print("Updated optional link library names; physics unchanged")
          PY
          grep -E '^(ADIOS2_LIBS|HDF5_LIBS|BOOST_LIBS|MPI_DIR|MPI_LIBS) =' SpacetimeX/scripts/actions-cpu-real64.cfg
          printf '%s\n' 'Available external dependency libraries:'
          find /usr/local/lib /usr/lib/x86_64-linux-gnu -maxdepth 4 -type f -o -type l 2>/dev/null | grep -E 'lib(adios2|hdf5|mpi|amrex)' | head -n 120 || true

      - name: Build external SpacetimeX Einstein plus two null streams
        working-directory: SpacetimeX
        shell: bash
        run: /bin/bash scripts/build.sh

      - name: Generate and audit Phase-C three-resolution parameter files
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/make_parfiles.py
          for f in generated_par/*.par; do ! grep -Eq '@N@|@TEND@|@OUTDIR@' "$f"; done
          grep -q 'cctk_final_time = 0.18' generated_par/ellis_dust_z4c_N16.par
          grep -q 'ncells_x = 32' generated_par/ellis_dust_z4c_N32.par
          for f in generated_par/*.par; do
            grep -q '^EllisBeamX::rad8pi = 0.12$' "$f"
            grep -q '^  ADMBaseX::metric$' "$f"
            grep -q '^Z4c::set_Theta_zero = no$' "$f"
            grep -q '^Z4c::kappa1 = 0.02$' "$f"
            grep -q '^  Z4c::Theta$' "$f"
            grep -q '^  Z4c::ZtC$' "$f"
            grep -q '^  Z4c::allC$' "$f"
          done

      - name: Execute external Einstein Toolkit evolution N16 N24 N32
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external_logs
          for n in 16 24 32; do
            par="${GITHUB_WORKSPACE}/generated_par/ellis_dust_z4c_N${n}.par"
            log="${GITHUB_WORKSPACE}/external_logs/N${n}.log"
            (cd "${GITHUB_WORKSPACE}/workspace/Cactus" && ./exe/cactus_sim "${par}") 2>&1 | tee "${log}"
          done

      - name: Phase-C conserved streams and anisotropic backreaction release gate
        shell: bash
        run: python3 scripts/phaseC_audit.py workspace/Cactus/external_results | tee phaseC_gate_output.txt

      - name: Archive external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ellis-einstein-toolkit-phase-c-v7
          path: |
            runner_identity.txt
            EllisBeamX/
            par/
            scripts/
            generated_par/
            SpacetimeX/scripts/spacetimex.th
            workspace/Cactus/build.log
            external_logs/
            external_phaseC_metrics.json
            phaseC_gate_output.txt
            workspace/Cactus/external_results/
          if-no-files-found: warn
          retention-days: 30
