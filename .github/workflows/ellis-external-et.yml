name: Ellis External Einstein Toolkit Reproduction (legacy manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  einstein-toolkit-phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: einsteintoolkit/carpetx:cpu-real64

    env:
      SPACETIMEX_SHA: e89fe1d3ee47adaf881f051c502fac61e4a4c0f9
      ACCELERATOR: cpu
      REAL_PRECISION: real64
      MODE: optimize
      OMP_NUM_THREADS: 2
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize Ellis external harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p EllisDustX
          echo 'UkVRVUlSRVMgQ2FycGV0WAo=' | base64 -d > EllisDustX/configuration.ccl
          mkdir -p EllisDustX
          echo '' | base64 -d > EllisDustX/interface.ccl
          mkdir -p EllisDustX
          echo '' | base64 -d > EllisDustX/param.ccl
          mkdir -p EllisDustX
          echo '' | base64 -d > EllisDustX/schedule.ccl
          mkdir -p EllisDustX/src
          echo '' | base64 -d > EllisDustX/src/ellis_dustx.cxx
          mkdir -p EllisDustX/src
          echo 'U1JDUyA9IGVsbGlzX2R1c3R4LmN4eAo=' | base64 -d > EllisDustX/src/make.code.defn
          mkdir -p par
          echo '' | base64 -d > par/ellis_dust_z4c.template.par
          mkdir -p scripts
          echo '' | base64 -d > scripts/patch_thornlist.py
          mkdir -p scripts
          echo '' | base64 -d > scripts/make_parfiles.py
          mkdir -p scripts
          echo '' | base64 -d > scripts/collect_norms.py
          mkdir -p scripts
          echo '' | base64 -d > scripts/phaseA_release_gate.py

      - name: Record external runner identity
        shell: bash
        run: |
          set -euxo pipefail
          uname -a | tee runner_identity.txt
          g++ --version | head -n 1 | tee -a runner_identity.txt
          python3 --version | tee -a runner_identity.txt
          echo "container=einsteintoolkit/carpetx:cpu-real64" | tee -a runner_identity.txt
          echo "spacetimex_sha=${SPACETIMEX_SHA}" | tee -a runner_identity.txt

      - name: Check out pinned SpacetimeX
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/EinsteinToolkit/SpacetimeX.git SpacetimeX
          git -C SpacetimeX checkout "${SPACETIMEX_SHA}"
          test "$(git -C SpacetimeX rev-parse HEAD)" = "${SPACETIMEX_SHA}"

      - name: Install EllisDustX into SpacetimeX
        shell: bash
        run: |
          set -euxo pipefail
          cp -a EllisDustX SpacetimeX/EllisDustX
          python3 scripts/patch_thornlist.py SpacetimeX/scripts/spacetimex.th
          grep -n "SpacetimeX/EllisDustX" SpacetimeX/scripts/spacetimex.th

      - name: Download Cactus and Einstein Toolkit dependencies
        working-directory: SpacetimeX
        shell: bash
        run: /bin/bash scripts/download.sh

      - name: Build independent SpacetimeX executable with EllisDustX
        working-directory: SpacetimeX
        shell: bash
        run: /bin/bash scripts/build.sh

      - name: Generate N=16,24,32 parameter files
        shell: bash
        run: python3 scripts/make_parfiles.py

      - name: Execute the external Einstein Toolkit evolution
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p external_logs
          for n in 16 24 32; do
            par="${GITHUB_WORKSPACE}/generated_par/ellis_dust_z4c_N${n}.par"
            log="${GITHUB_WORKSPACE}/external_logs/N${n}.log"
            (
              cd "${GITHUB_WORKSPACE}/workspace/Cactus"
              ./exe/cactus_sim "${par}"
            ) 2>&1 | tee "${log}"
          done

      - name: Collect independent CarpetX norm diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/collect_norms.py workspace/Cactus/external_results | tee external_metrics_stdout.txt

      - name: Run Phase-A anti-fake release gate
        shell: bash
        run: python3 scripts/phaseA_release_gate.py | tee phaseA_gate_output.txt

      - name: Archive real external output
        uses: actions/upload-artifact@v4
        with:
          name: ellis-einstein-toolkit-phase-a
          path: |
            runner_identity.txt
            external_logs/
            external_phaseA_metrics.json
            external_metrics_stdout.txt
            phaseA_gate_output.txt
            workspace/Cactus/build.log
            workspace/Cactus/external_results/
          if-no-files-found: error
          retention-days: 30
